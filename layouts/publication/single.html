{{ define "main" }}
<article class="paper">
  <h1>{{ .Title }}</h1>
  {{ partial "pub-meta.html" (dict "page" . "full" true) }}
  {{- with .Params.abstract }}
  <h2>Abstract</h2>
  <div class="abstract">{{ . | markdownify }}</div>
  {{- end }}
  {{ .Content }}
  <p class="all"><a href="{{ .Parent.RelPermalink }}">← All publications</a></p>
</article>
{{ end }}
