# Site configuration. Layouts live in layouts/, styles in assets/css/main.css.
baseURL = "https://lorenzomasoero.com/"
title = "Lorenzo Masoero"
locale = "en-US"
enableRobotsTXT = true

# Only the homepage, the publications list, and one page per paper are built.
disableKinds = ["taxonomy", "term", "rss"]

[taxonomies]
  # No tags or categories.

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

[markup.goldmark.renderer]
  unsafe = false

[params]
  name = "Lorenzo Masoero"
  role = "Senior Applied Scientist, Amazon"
  description = "Lorenzo Masoero, Senior Applied Scientist at Amazon: causal inference and experimental design for large-scale online systems."
  portrait = "img/portrait.jpg"
  cv = "/files/cv_masoero_2026.pdf"
  email = "lo.masoero@gmail.com"
  scholar = "https://scholar.google.com/citations?user=qFFGfdYAAAAJ"
  github = "https://github.com/lorenzomasoero"
  linkedin = "https://www.linkedin.com/in/lorenzomasoero"

[[menu.main]]
  name = "Publications"
  pageRef = "/publication"
  weight = 1

[[menu.main]]
  name = "CV"
  url = "/files/cv_masoero_2026.pdf"
  weight = 2

# Expose static/img to Hugo's image processing (for the resized portrait)
# without duplicating the file. static/ itself is still copied as-is.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"
  [[module.mounts]]
    source = "assets"
    target = "assets"
